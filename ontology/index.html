<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Explore the Skills &amp; Practices Framework</title>
<link rel="stylesheet" href="../fonts/poppins.css" />
<style>
  :root{
    --bg:#f7f5f1; --panel:#ffffff; --ink:#23201b; --muted:#6b6459; --faint:#8c8478;
    --hairline:#e4dfd6; --accent:#3f5e86; --chip:#f0ede7;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17161a; --panel:#201f24; --ink:#ece7de; --muted:#a39a8c; --faint:#7d7568;
      --hairline:#332f37; --accent:#91b2df; --chip:#2a2830; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Poppins',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;}
  header{display:flex;align-items:center;gap:.9rem;padding:.6rem .9rem;border-bottom:1px solid var(--hairline);flex:0 0 auto;flex-wrap:wrap;}
  header h1{font-family:'Poppins',sans-serif;font-size:1.02rem;margin:0;white-space:nowrap;}
  header .sub{color:var(--faint);font-size:.78rem;}
  .grow{flex:1 1 auto;}
  #search{flex:0 1 320px;min-width:160px;padding:.42rem .6rem;border:1px solid var(--hairline);border-radius:8px;background:var(--panel);color:var(--ink);font-size:.9rem;}
  button.btn{padding:.42rem .7rem;border:1px solid var(--hairline);border-radius:8px;background:var(--panel);color:var(--ink);font-size:.85rem;cursor:pointer;font-weight:600;}
  button.btn:hover{border-color:var(--accent);}
  .actions{display:flex;gap:.4rem;margin:.15rem 0 .35rem;}
  .btn.sm{padding:.28rem .6rem;font-size:.78rem;}
  main{flex:1 1 auto;display:grid;grid-template-columns:210px 1fr 340px;min-height:0;}
  @media (max-width:900px){ main{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;} #legend{max-height:120px;} }
  #legend{border-right:1px solid var(--hairline);overflow:auto;padding:.5rem;}
  #legend h2,#details h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin:.2rem .3rem .5rem;}
  .tybtn{display:flex;align-items:center;gap:.5rem;width:100%;text-align:left;padding:.32rem .4rem;border:none;background:none;color:var(--ink);border-radius:6px;cursor:pointer;font-size:.83rem;}
  .tybtn:hover{background:var(--chip);}
  .sw{width:.8rem;height:.8rem;border-radius:3px;flex:0 0 auto;}
  .tybtn .n{margin-left:auto;color:var(--faint);font-size:.75rem;font-variant-numeric:tabular-nums;}
  #cy{width:100%;height:100%;min-height:0;}
  #details{border-left:1px solid var(--hairline);overflow:auto;padding:.7rem .8rem;background:var(--panel);}
  #details .kind{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;padding:.12rem .5rem;border-radius:999px;}
  #details h3{font-family:'Poppins',sans-serif;font-size:1.2rem;margin:.5rem 0 .3rem;}
  #details p.desc{color:var(--muted);font-size:.9rem;margin:.3rem 0 .8rem;}
  #details .rel{margin-top:.7rem;}
  #details .rel .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:700;margin-bottom:.3rem;}
  .chip{display:inline-block;margin:.15rem .2rem .15rem 0;padding:.2rem .55rem;border-radius:999px;background:var(--chip);color:var(--ink);font-size:.8rem;cursor:pointer;border:1px solid transparent;}
  .chip:hover{border-color:var(--accent);}
  .chip .tdot{display:inline-block;width:.5rem;height:.5rem;border-radius:50%;margin-right:.35rem;vertical-align:baseline;}
  #details .field{margin-top:.5rem;font-size:.86rem;}
  #details .field b{color:var(--ink);}
  #details .hint{color:var(--faint);font-size:.85rem;line-height:1.5;}
  #details .instlist button{display:block;width:100%;text-align:left;padding:.3rem .4rem;border:none;background:none;color:var(--ink);border-radius:6px;cursor:pointer;font-size:.85rem;}
  #details .instlist button:hover{background:var(--chip);}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.95rem;}
</style>
</head>
<body>
<header>
  <h1>Skills &amp; Practices Framework</h1>
  <span class="sub">interactive ontology</span>
  <input id="search" list="allnodes" placeholder="Search anything…" autocomplete="off" />
  <datalist id="allnodes"></datalist>
  <button class="btn" id="home">Overview</button>
  <span class="grow"></span>
  <span class="sub" id="stat"></span>
</header>
<main>
  <aside id="legend"><h2>Data types</h2><div id="types"></div></aside>
  <div style="position:relative;min-height:0;"><div id="cy"></div><div class="loading" id="loading">Loading the framework…</div></div>
  <aside id="details"><div id="dpanel"></div></aside>
</main>

<script src="./cytoscape.min.js"></script>
<script>
const SNAPSHOT = "../data/json/framework.snapshot.json";
const state = { nodes:new Map(), edges:[], adj:new Map(), degree:new Map(), types:[], typeMeta:{}, cy:null, color:{} };

// nice label from an entity slug
const titleCase = s => s.replace(/[-_]/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const isLink = v => Array.isArray(v) && v.length && v[0] && typeof v[0]==="object" && "slug" in v[0];

function palette(i,n){ const h=Math.round((i*360/n)+15)%360; return `hsl(${h}, 55%, 55%)`; } // commas: Cytoscape's color parser rejects space-separated hsl()

async function init(){
  const snap = await (await fetch(SNAPSHOT)).json();
  const entities = snap.entities.filter(e=>e.file.startsWith("framework-data/"));
  state.types = entities.map(e=>e.entity);
  entities.forEach((e,i)=>{ state.color[e.entity]=palette(i,entities.length); state.typeMeta[e.entity]={label:titleCase(e.entity),primary:e.primaryField,count:0}; });

  // nodes (first entity wins on slug collision, matching the validator)
  for(const e of entities){
    for(const r of (snap.data[e.entity]||[])){
      if(!r.slug || state.nodes.has(r.slug)) continue;
      state.nodes.set(r.slug,{ id:r.slug, type:e.entity, label:r[e.primaryField]||r.slug, rec:r });
      state.typeMeta[e.entity].count++;
    }
  }
  // edges
  const seen=new Set();
  for(const e of entities){
    for(const r of (snap.data[e.entity]||[])){
      if(!r.slug) continue;
      for(const [field,val] of Object.entries(r)){
        if(!isLink(val)) continue;
        for(const t of val){
          if(!state.nodes.has(t.slug)) continue;
          const k=r.slug+"|"+t.slug+"|"+field; if(seen.has(k))continue; seen.add(k);
          state.edges.push({s:r.slug,t:t.slug,rel:field});
          (state.adj.get(r.slug)||state.adj.set(r.slug,new Set()).get(r.slug)).add(t.slug);
          (state.adj.get(t.slug)||state.adj.set(t.slug,new Set()).get(t.slug)).add(r.slug);
          state.degree.set(r.slug,(state.degree.get(r.slug)||0)+1);
          state.degree.set(t.slug,(state.degree.get(t.slug)||0)+1);
        }
      }
    }
  }

  document.getElementById("stat").textContent = `${state.nodes.size} records · ${state.edges.length} relationships`;
  buildLegend(); buildSearch(); initCy();
  document.getElementById("loading").remove();
  showSchema();
}

function buildLegend(){
  const box=document.getElementById("types");
  for(const ty of state.types){
    const m=state.typeMeta[ty]; const b=document.createElement("button"); b.className="tybtn";
    b.innerHTML=`<span class="sw" style="background:${state.color[ty]}"></span>${m.label}<span class="n">${m.count}</span>`;
    b.onclick=()=>selectType(ty); box.appendChild(b);
  }
}
function buildSearch(){
  const dl=document.getElementById("allnodes");
  for(const n of state.nodes.values()){ const o=document.createElement("option"); o.value=n.label; o.dataset.slug=n.id; dl.appendChild(o); }
  const inp=document.getElementById("search");
  inp.addEventListener("change",()=>{
    const match=[...state.nodes.values()].find(n=>n.label===inp.value);
    if(match){ focusNode(match.id); inp.value=""; }
  });
}

function initCy(){
  state.cy=cytoscape({ container:document.getElementById("cy"), wheelSensitivity:.25,
    style:[
      {selector:"node",style:{"background-color":"data(color)","label":"data(label)","font-size":"14px","color":"#111","text-outline-color":"#fff","text-outline-width":2.5,"width":"data(size)","height":"data(size)","text-wrap":"wrap","text-max-width":"130px","min-zoomed-font-size":8}},
      {selector:"node.type",style:{"font-size":"20px","font-weight":"bold","shape":"ellipse","text-outline-width":3}},
      {selector:"node.focus",style:{"border-width":3,"border-color":"#111"}},
      {selector:"edge",style:{"width":1,"line-color":"#aaa","curve-style":"bezier","opacity":.4,"target-arrow-shape":"none","label":"","font-size":"8px","color":"#333","text-background-color":"#fff","text-background-opacity":.85,"text-background-padding":"2px"}},
      {selector:"edge[w]",style:{"width":ele=>Math.max(1,Math.min(8,Math.log2((ele.data("w")||1)+1)))}},
      {selector:"edge.hl",style:{"line-color":"#3f5e86","opacity":.95,"width":2,"label":"data(rel)"}},
      {selector:"edge.hovered",style:{"line-color":"#3f5e86","opacity":1,"width":2.5,"label":"data(rel)","z-index":20}},
      {selector:".dim",style:{"opacity":.12}}
    ]
  });
  state.cy.on("tap","node",evt=>{ const d=evt.target.data(); if(d.kind==="type") selectType(d.entity); else selectNode(d.id); });
  state.cy.on("mouseover","edge",e=>e.target.addClass("hovered"));
  state.cy.on("mouseout","edge",e=>e.target.removeClass("hovered"));
}

function nodeSize(slug){ return Math.max(16,Math.min(46,12+(state.degree.get(slug)||0)*1.3)); }

// ---- Overview: the schema (types + aggregated relationships) ----
function showSchema(){
  const cy=state.cy; cy.elements().remove();
  const els=[];
  for(const ty of state.types){ const m=state.typeMeta[ty]; els.push({data:{id:"type:"+ty,kind:"type",entity:ty,count:m.count,label:`${m.label}\n${m.count}`,color:state.color[ty],size:Math.max(30,Math.min(58,22+m.count*.26))},classes:"type"}); }
  const pair=new Map();
  for(const e of state.edges){ const a=state.nodes.get(e.s).type,b=state.nodes.get(e.t).type; if(a===b)continue; const k=[a,b].sort().join("~"); pair.set(k,(pair.get(k)||0)+1); }
  for(const [k,c] of pair){ const [a,b]=k.split("~"); els.push({data:{id:"te:"+k,source:"type:"+a,target:"type:"+b,w:c}}); }
  cy.add(els);
  // The schema is almost a complete graph, so a force layout crunches every bubble together and a
  // single ring makes labels tiny when fit to the viewport. A grid packs the 21 types into the
  // viewport most efficiently, so labels stay large and readable; relationships are a soft web on top.
  cy.layout({name:"grid",animate:false,padding:22,avoidOverlap:true,avoidOverlapPadding:16,nodeDimensionsIncludeLabels:true,condense:false}).run();
  cy.fit(undefined,24);
  // Keep type labels readable: 20px base font, so zoom >=0.85 keeps them >=17px. The grid may
  // extend past the viewport at that zoom, which is fine — users pan and zoom to explore.
  const z=cy.zoom(); if(z<0.9){ cy.zoom(0.9); cy.center(); } else if(z>1.3){ cy.zoom(1.3); cy.center(); }
  detailsIntro();
}

function detailsIntro(){
  document.getElementById("dpanel").innerHTML=
    `<h2>The ontology</h2>
     <p class="hint">This is the whole framework at a glance: every <b>data type</b> and how it connects to the others. Bigger bubbles hold more records; thicker lines mean more relationships.</p>
     <p class="hint" style="margin-top:.6rem"><b>To explore:</b> click a type bubble (or a type on the left) to see what's inside it, then click any item to walk its connections. Use search up top to jump to anything.</p>`;
}

// ---- A type: description + its instances ----
function selectType(ty){
  const cy=state.cy; const m=state.typeMeta[ty];
  // highlight the type in the schema if present, else just fill the panel
  const insts=[...state.nodes.values()].filter(n=>n.type===ty).sort((a,b)=>(state.degree.get(b.id)||0)-(state.degree.get(a.id)||0));
  const list=insts.map(n=>`<button data-slug="${n.id}">${escapeHtml(n.label)} <span style="color:var(--faint);font-size:.75rem">· ${state.degree.get(n.id)||0}</span></button>`).join("");
  document.getElementById("dpanel").innerHTML=
    `<span class="kind" style="background:${state.color[ty]}">${m.label}</span>
     <h3>${m.label}</h3>
     <p class="desc">${m.count} records. Click any to explore its connections.</p>
     <div class="rel"><div class="lbl">Items</div><div class="instlist">${list}</div></div>`;
  document.querySelectorAll("#details .instlist button").forEach(b=>b.onclick=()=>focusNode(b.dataset.slug));
}

// ---- A node: ego-network, grow outward, full details ----
function addNodeEl(slug){
  const cy=state.cy; if(cy.getElementById(slug).nonempty()) return;
  const n=state.nodes.get(slug); if(!n) return;
  cy.add({group:"nodes",data:{id:slug,label:n.label,color:state.color[n.type],size:nodeSize(slug)}});
}
function addEdgesAmong(){ // add every edge whose both endpoints are on the canvas
  const cy=state.cy; const present=new Set(cy.nodes().map(n=>n.id()));
  for(const e of state.edges){
    if(!present.has(e.s)||!present.has(e.t)) continue;
    const id="e:"+e.s+"|"+e.t+":"+e.rel;
    if(cy.getElementById(id).nonempty()) continue;
    cy.add({group:"edges",data:{id,source:e.s,target:e.t,rel:titleCase(e.rel)}});
  }
}
function focusNode(slug){ // reset the canvas to this node's ego network
  const node=state.nodes.get(slug); if(!node) return;
  const cy=state.cy; cy.elements().remove();
  addNodeEl(slug); for(const nb of (state.adj.get(slug)||[])) addNodeEl(nb);
  addEdgesAmong();
  cy.layout({name:"concentric",animate:false,concentric:n=>n.id()===slug?10:1,levelWidth:()=>1,minNodeSpacing:48,padding:50,avoidOverlap:true,nodeDimensionsIncludeLabels:true}).run();
  cy.fit(undefined,60); selectNode(slug);
}
function growNode(slug){ // add this node's neighbors into the current canvas (hop outward)
  const cy=state.cy; const before=cy.nodes().length;
  for(const nb of (state.adj.get(slug)||[])) addNodeEl(nb);
  addEdgesAmong();
  if(cy.nodes().length!==before) cy.layout({name:"cose",animate:true,animationDuration:450,padding:40,nodeRepulsion:16000,idealEdgeLength:130,nodeDimensionsIncludeLabels:true}).run();
  selectNode(slug);
}
function addAndSelect(slug){ // from a relationship chip: bring it onto the canvas, then select it
  const cy=state.cy;
  if(cy.getElementById(slug).empty()){ addNodeEl(slug); addEdgesAmong(); cy.layout({name:"cose",animate:true,animationDuration:450,padding:40,nodeRepulsion:16000,idealEdgeLength:130,nodeDimensionsIncludeLabels:true}).run(); }
  selectNode(slug);
}
function selectNode(slug){
  const node=state.nodes.get(slug); if(!node) return;
  const cy=state.cy;
  cy.nodes().removeClass("focus"); cy.edges().removeClass("hl");
  const n=cy.getElementById(slug);
  if(n.nonempty()){ n.addClass("focus"); n.connectedEdges().addClass("hl"); cy.animate({center:{eles:n}},{duration:280}); }
  renderNodeDetails(node);
}

function renderNodeDetails(node){
  const rec=node.rec; const m=state.typeMeta[node.type];
  let html=`<span class="kind" style="background:${state.color[node.type]}">${m.label}</span><h3>${escapeHtml(node.label)}</h3>`;
  html+=`<div class="actions"><button class="btn sm" id="expandbtn">＋ Expand neighbors</button><button class="btn sm" id="refocusbtn">⤢ Focus here</button></div>`;
  const descKeys=Object.keys(rec).filter(k=>/description|why|summary|day in the life|what is/i.test(k));
  for(const k of descKeys){ if(typeof rec[k]==="string"&&rec[k].trim()) html+=`<p class="desc">${escapeHtml(rec[k])}</p>`; }
  for(const [field,val] of Object.entries(rec)){
    if(!isLink(val)) continue;
    const chips=val.filter(t=>state.nodes.has(t.slug)).map(t=>{ const tn=state.nodes.get(t.slug); return `<span class="chip" data-slug="${t.slug}"><span class="tdot" style="background:${state.color[tn.type]}"></span>${escapeHtml(t.label)}</span>`; }).join("");
    if(chips) html+=`<div class="rel"><div class="lbl">${escapeHtml(field)}</div>${chips}</div>`;
  }
  for(const [k,v] of Object.entries(rec)){
    if(isLink(v)||descKeys.includes(k)||["id","slug"].includes(k)) continue;
    if(typeof v==="string"&&v.length<120&&v.trim()) html+=`<div class="field"><b>${escapeHtml(k)}:</b> ${escapeHtml(v)}</div>`;
  }
  const dp=document.getElementById("dpanel"); dp.innerHTML=html;
  dp.querySelector("#expandbtn").onclick=()=>growNode(node.id);
  dp.querySelector("#refocusbtn").onclick=()=>focusNode(node.id);
  dp.querySelectorAll(".chip").forEach(c=>c.onclick=()=>addAndSelect(c.dataset.slug));
}

function escapeHtml(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cssEsc(s){ return (window.CSS&&CSS.escape)?CSS.escape(s):s.replace(/[^a-zA-Z0-9_-]/g,"\\$&"); }

document.getElementById("home").onclick=showSchema;
init().catch(e=>{ document.getElementById("loading").textContent="Failed to load: "+e.message; });
</script>
</body>
</html>
