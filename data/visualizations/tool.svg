<svg viewBox="0 0 1800 1800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title>Tool — relationships to every other data type</title><rect x="0" y="0" width="1800" height="1800" fill="#ffffff"/><text x="60" y="70" font-size="30" font-weight="700" fill="#111827">Tool</text><text x="60" y="100" font-size="15" fill="#6b7280">Every line is a two-way relationship to another data type in the framework.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker></defs><line x1="900.0" y1="830.0" x2="900.0" y2="292.0" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(900.0,560.0) rotate(-90.0)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools extend a person's skills and usually take skill to operate well.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">People rely on their skills to use tools effectively.</text></g><line x1="930.4" y1="836.9" x2="1163.8" y2="352.2" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1047.5,593.7) rotate(-64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">How openly a team uses its tools reflects its practices.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Practices influence how openly and collaboratively a team uses its tools.</text></g><line x1="954.7" y1="856.4" x2="1375.4" y2="520.9" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1165.8,688.0) rotate(-38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools support the work of a project and keep the team organized.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Projects rely on a set of tools to get the work done and stay organized.</text></g><line x1="968.2" y1="884.4" x2="1492.8" y2="764.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1231.5,824.3) rotate(-12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">The tools a person reaches for are often set by the duty they hold.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Each duty comes with the tools a person is expected to use.</text></g><line x1="968.2" y1="915.6" x2="1492.8" y2="1035.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1231.5,975.7) rotate(12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools help teams share progress and outputs with stakeholders.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Stakeholders may request certain tools or need access to the team's outputs.</text></g><line x1="954.7" y1="943.6" x2="1375.4" y2="1279.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1165.8,1112.0) rotate(38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools help teams reach and track their milestones.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Milestones often require specific tools to reach and to show progress.</text></g><line x1="930.4" y1="963.1" x2="1163.8" y2="1447.8" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1047.5,1206.3) rotate(64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools are what people use to carry out many activities.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Activities are carried out using the team's tools.</text></g><line x1="900.0" y1="970.0" x2="900.0" y2="1508.0" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(900.0,1240.0) rotate(90.0)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools are used to build and refine deliverables.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Deliverables are created and refined using the team's tools.</text></g><line x1="869.6" y1="963.1" x2="636.2" y2="1447.8" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(752.5,1206.3) rotate(-64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">The tools a person uses are often tied to their job function.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Each job function tends to rely on its own set of tools.</text></g><line x1="845.3" y1="943.6" x2="424.6" y2="1279.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(634.2,1112.0) rotate(-38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Each specialization leans on its own set of tools to do the work.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Learning a specialization usually means learning the tools that come with it.</text></g><line x1="831.8" y1="915.6" x2="307.2" y2="1035.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(568.5,975.7) rotate(-12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">A tool may be standard in one company type and rare in another.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">The tools a team uses can depend on the company type.</text></g><line x1="831.8" y1="884.4" x2="307.2" y2="764.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(568.5,824.3) rotate(12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools support the way a methodology asks a team to work.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A methodology guides which tools a team reaches for.</text></g><line x1="845.3" y1="856.4" x2="424.6" y2="520.9" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(634.2,688.0) rotate(38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Tools like shared boards and templates are what make workshops run.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Workshops make use of shared tools like boards and templates.</text></g><line x1="869.6" y1="836.9" x2="636.2" y2="352.2" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(752.5,593.7) rotate(64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Some tools carry over from other industries, while others are new to tech.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Each industry brings its own familiar tools, some of which transfer to tech.</text></g><rect x="790" y="203" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="900" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Skills</text><text x="900" y="239" text-anchor="middle" font-size="9.5" fill="#374151">A competency in an area of</text><text x="900" y="251" text-anchor="middle" font-size="9.5" fill="#374151">expertise.</text><rect x="1076.3632678175886" y="268.36054718440346" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1186.3632678175886" y="288.36054718440346" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Practices</text><text x="1186.3632678175886" y="304.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">A set of beliefs and behaviors</text><text x="1186.3632678175886" y="316.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">that drive successful</text><text x="1186.3632678175886" y="328.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">teamwork.</text><rect x="1306.0087784288996" y="451.4967307732359" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1416.0087784288996" y="471.4967307732359" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Project</text><text x="1416.0087784288996" y="487.4967307732359" text-anchor="middle" font-size="9.5" fill="#374151">A work outcome that meets</text><text x="1416.0087784288996" y="499.4967307732359" text-anchor="middle" font-size="9.5" fill="#374151">agreed to goals.</text><rect x="1433.4524220400035" y="716.1361835888324" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1543.4524220400035" y="736.1361835888324" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Duty</text><text x="1543.4524220400035" y="752.1361835888324" text-anchor="middle" font-size="9.5" fill="#374151">A set of expected duties.</text><rect x="1433.4524220400035" y="1009.8638164111676" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1543.4524220400035" y="1029.8638164111676" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Stakeholder</text><text x="1543.4524220400035" y="1045.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">A person who drives the needs</text><text x="1543.4524220400035" y="1057.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">of work.</text><rect x="1306.0087784288996" y="1274.5032692267641" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1416.0087784288996" y="1294.5032692267641" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Milestone</text><text x="1416.0087784288996" y="1310.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">A measured outcome of work</text><text x="1416.0087784288996" y="1322.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">progress.</text><rect x="1076.3632678175886" y="1457.6394528155965" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1186.3632678175886" y="1477.6394528155965" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Activity</text><text x="1186.3632678175886" y="1493.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">A routine that people do</text><text x="1186.3632678175886" y="1505.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">together.</text><rect x="790" y="1523" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="900" y="1543" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Deliverable</text><text x="900" y="1559" text-anchor="middle" font-size="9.5" fill="#374151">Something provided as a result</text><text x="900" y="1571" text-anchor="middle" font-size="9.5" fill="#374151">of a process.</text><rect x="503.6367321824114" y="1457.6394528155965" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="613.6367321824114" y="1477.6394528155965" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Function</text><text x="613.6367321824114" y="1493.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">The label used to describe</text><text x="613.6367321824114" y="1505.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">responsibilities at a company.</text><rect x="273.99122157110037" y="1274.5032692267641" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="383.99122157110037" y="1294.5032692267641" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Specialization</text><text x="383.99122157110037" y="1310.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">An subject matter area of</text><text x="383.99122157110037" y="1322.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">expertise.</text><rect x="146.54757795999637" y="1009.8638164111676" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="256.5475779599964" y="1029.8638164111676" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Company Type</text><text x="256.5475779599964" y="1045.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">The formation type for a</text><text x="256.5475779599964" y="1057.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">company that dictates how work</text><text x="256.5475779599964" y="1069.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">gets delivered</text><rect x="146.5475779599966" y="716.136183588832" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="256.5475779599966" y="736.136183588832" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Methodology</text><text x="256.5475779599966" y="752.136183588832" text-anchor="middle" font-size="9.5" fill="#374151">A step-by-step process to</text><text x="256.5475779599966" y="764.136183588832" text-anchor="middle" font-size="9.5" fill="#374151">carry out work.</text><rect x="273.99122157110025" y="451.496730773236" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="383.99122157110025" y="471.496730773236" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Workshop</text><text x="383.99122157110025" y="487.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">A facilitated group activity</text><text x="383.99122157110025" y="499.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">that accomplishes a shared</text><text x="383.99122157110025" y="511.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">goal.</text><rect x="503.6367321824116" y="268.36054718440346" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="613.6367321824116" y="288.36054718440346" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Industry</text><text x="613.6367321824116" y="304.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">A category for companies that</text><text x="613.6367321824116" y="316.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">perform a certain type of</text><text x="613.6367321824116" y="328.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">work.</text><rect x="780" y="855" width="240" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="900" y="875" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Tool</text><text x="900" y="891" text-anchor="middle" font-size="9.5" fill="#374151">An object (physical or</text><text x="900" y="903" text-anchor="middle" font-size="9.5" fill="#374151">digital) that’s used to</text><text x="900" y="915" text-anchor="middle" font-size="9.5" fill="#374151">complete work.</text></svg>