<svg viewBox="0 0 1800 1800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title>Practices — relationships to every other data type</title><rect x="0" y="0" width="1800" height="1800" fill="#ffffff"/><text x="60" y="70" font-size="30" font-weight="700" fill="#111827">Practices</text><text x="60" y="100" font-size="15" fill="#6b7280">Every line is a two-way relationship to another data type in the framework.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker></defs><line x1="900.0" y1="830.0" x2="900.0" y2="292.0" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(900.0,560.0) rotate(-90.0)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices shape how a person applies a skill with others, so the same skill lands differently depending on the practices behind it.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">People need practices like shared ownership and psychological safety to use their skills well on a team.</text></g><line x1="932.5" y1="838.0" x2="1182.6" y2="361.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1058.0,598.9) rotate(-62.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices set the tone for how a team works together to deliver a project.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Projects are where a team's practices get tested under real pressure.</text></g><line x1="957.6" y1="860.2" x2="1400.4" y2="554.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1179.8,706.9) rotate(-34.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices guide how a person carries out a duty alongside teammates.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A duty is carried out through practices that guide how a person works with others.</text></g><line x1="969.5" y1="891.6" x2="1503.6" y2="826.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1237.5,859.0) rotate(-6.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices like humility and active listening shape how a team includes and serves its stakeholders.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Stakeholders are served better when a team practices humility, listening, and inclusion.</text></g><line x1="965.5" y1="924.8" x2="1468.5" y2="1115.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1217.9,1020.6) rotate(20.8)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices help a team stay aligned and adaptable as they work toward a milestone.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Reaching a milestone is smoother when the team leans on practices like adaptability and shared ownership.</text></g><line x1="946.4" y1="952.4" x2="1303.2" y2="1355.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1125.5,1154.5) rotate(48.5)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices influence how openly and collaboratively a team uses its tools.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">How openly a team uses its tools reflects its practices.</text></g><line x1="916.8" y1="968.0" x2="1045.5" y2="1490.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(981.4,1230.1) rotate(76.2)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices shape how people show up for shared activities, like listening and making space for others.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Activities are where practices show up in how people work together.</text></g><line x1="883.2" y1="968.0" x2="754.5" y2="1490.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(818.6,1230.1) rotate(-76.2)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices affect the quality of deliverables by shaping how the team collaborates to make them.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">The quality of a deliverable reflects how well the team practiced collaboration to make it.</text></g><line x1="853.6" y1="952.4" x2="496.8" y2="1355.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(674.5,1154.5) rotate(-48.5)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices define the human, behavioral side of doing a job function well.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A job function is done well when a person brings strong team practices to it.</text></g><line x1="834.5" y1="924.8" x2="331.5" y2="1115.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(582.1,1020.6) rotate(-20.8)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices help a team stay healthy no matter which company type they work in.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Every company type benefits from healthy team practices, whatever its structure.</text></g><line x1="830.5" y1="891.6" x2="296.4" y2="826.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(562.5,859.0) rotate(6.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are the mindset that makes a methodology actually work, not just its steps.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A methodology only works when the team lives out the practices behind it.</text></g><line x1="842.4" y1="860.2" x2="399.6" y2="554.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(620.2,706.9) rotate(34.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are taught and strengthened through team workshops.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Workshops are where teams learn and rehearse healthy practices.</text></g><line x1="867.5" y1="838.0" x2="617.4" y2="361.6" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(742.0,598.9) rotate(62.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are transferable behaviors people can bring from any industry into tech work.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">People bring transferable practices, like collaboration, from any industry.</text></g><rect x="790" y="203" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="900" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Skills</text><text x="900" y="239" text-anchor="middle" font-size="9.5" fill="#374151">A competency in an area of</text><text x="900" y="251" text-anchor="middle" font-size="9.5" fill="#374151">expertise.</text><rect x="1096.7172935488873" y="278.5990230688815" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1206.7172935488873" y="298.5990230688815" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Project</text><text x="1206.7172935488873" y="314.5990230688815" text-anchor="middle" font-size="9.5" fill="#374151">A work outcome that meets</text><text x="1206.7172935488873" y="326.5990230688815" text-anchor="middle" font-size="9.5" fill="#374151">agreed to goals.</text><rect x="1333.1693514898132" y="488.0772671574372" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1443.1693514898132" y="508.0772671574372" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Duty</text><text x="1443.1693514898132" y="524.0772671574372" text-anchor="middle" font-size="9.5" fill="#374151">A set of expected duties.</text><rect x="1445.1878569047158" y="783.4457910314868" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1555.1878569047158" y="803.4457910314868" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Stakeholder</text><text x="1555.1878569047158" y="819.4457910314868" text-anchor="middle" font-size="9.5" fill="#374151">A person who drives the needs</text><text x="1555.1878569047158" y="831.4457910314868" text-anchor="middle" font-size="9.5" fill="#374151">of work.</text><rect x="1407.110720172374" y="1097.0392254480735" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1517.110720172374" y="1117.0392254480735" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Milestone</text><text x="1517.110720172374" y="1133.0392254480735" text-anchor="middle" font-size="9.5" fill="#374151">A measured outcome of work</text><text x="1517.110720172374" y="1145.0392254480735" text-anchor="middle" font-size="9.5" fill="#374151">progress.</text><rect x="1227.6609544389248" y="1357.0170937929267" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1337.6609544389248" y="1377.0170937929267" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Tool</text><text x="1337.6609544389248" y="1393.0170937929267" text-anchor="middle" font-size="9.5" fill="#374151">An object (physical or</text><text x="1337.6609544389248" y="1405.0170937929267" text-anchor="middle" font-size="9.5" fill="#374151">digital) that’s used to</text><text x="1337.6609544389248" y="1417.0170937929267" text-anchor="middle" font-size="9.5" fill="#374151">complete work.</text><rect x="947.948338429788" y="1503.8215995011942" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1057.948338429788" y="1523.8215995011942" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Activity</text><text x="1057.948338429788" y="1539.8215995011942" text-anchor="middle" font-size="9.5" fill="#374151">A routine that people do</text><text x="1057.948338429788" y="1551.8215995011942" text-anchor="middle" font-size="9.5" fill="#374151">together.</text><rect x="632.0516615702118" y="1503.8215995011942" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="742.0516615702118" y="1523.8215995011942" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Deliverable</text><text x="742.0516615702118" y="1539.8215995011942" text-anchor="middle" font-size="9.5" fill="#374151">Something provided as a result</text><text x="742.0516615702118" y="1551.8215995011942" text-anchor="middle" font-size="9.5" fill="#374151">of a process.</text><rect x="352.3390455610751" y="1357.0170937929265" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="462.3390455610751" y="1377.0170937929265" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Function</text><text x="462.3390455610751" y="1393.0170937929265" text-anchor="middle" font-size="9.5" fill="#374151">The label used to describe</text><text x="462.3390455610751" y="1405.0170937929265" text-anchor="middle" font-size="9.5" fill="#374151">responsibilities at a company.</text><rect x="172.8892798276263" y="1097.0392254480737" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="282.8892798276263" y="1117.0392254480737" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Company Type</text><text x="282.8892798276263" y="1133.0392254480737" text-anchor="middle" font-size="9.5" fill="#374151">The formation type for a</text><text x="282.8892798276263" y="1145.0392254480737" text-anchor="middle" font-size="9.5" fill="#374151">company that dictates how work</text><text x="282.8892798276263" y="1157.0392254480737" text-anchor="middle" font-size="9.5" fill="#374151">gets delivered</text><rect x="134.81214309528434" y="783.4457910314873" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="244.81214309528434" y="803.4457910314873" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Methodology</text><text x="244.81214309528434" y="819.4457910314873" text-anchor="middle" font-size="9.5" fill="#374151">A step-by-step process to</text><text x="244.81214309528434" y="831.4457910314873" text-anchor="middle" font-size="9.5" fill="#374151">carry out work.</text><rect x="246.83064851018707" y="488.07726715743684" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="356.8306485101871" y="508.07726715743684" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Workshop</text><text x="356.8306485101871" y="524.0772671574368" text-anchor="middle" font-size="9.5" fill="#374151">A facilitated group activity</text><text x="356.8306485101871" y="536.0772671574368" text-anchor="middle" font-size="9.5" fill="#374151">that accomplishes a shared</text><text x="356.8306485101871" y="548.0772671574368" text-anchor="middle" font-size="9.5" fill="#374151">goal.</text><rect x="483.2827064511124" y="278.5990230688817" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="593.2827064511124" y="298.5990230688817" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Industry</text><text x="593.2827064511124" y="314.5990230688817" text-anchor="middle" font-size="9.5" fill="#374151">A category for companies that</text><text x="593.2827064511124" y="326.5990230688817" text-anchor="middle" font-size="9.5" fill="#374151">perform a certain type of</text><text x="593.2827064511124" y="338.5990230688817" text-anchor="middle" font-size="9.5" fill="#374151">work.</text><rect x="780" y="855" width="240" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="900" y="875" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Practices</text><text x="900" y="891" text-anchor="middle" font-size="9.5" fill="#374151">A set of beliefs and behaviors</text><text x="900" y="903" text-anchor="middle" font-size="9.5" fill="#374151">that drive successful</text><text x="900" y="915" text-anchor="middle" font-size="9.5" fill="#374151">teamwork.</text></svg>