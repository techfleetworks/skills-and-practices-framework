<svg viewBox="0 0 1800 1800" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"><title>Practices — relationships to every other data type</title><rect x="0" y="0" width="1800" height="1800" fill="#ffffff"/><text x="60" y="70" font-size="30" font-weight="700" fill="#111827">Practices</text><text x="60" y="100" font-size="15" fill="#6b7280">Every line is a two-way relationship to another data type in the framework.</text><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/></marker></defs><line x1="900.0" y1="830.0" x2="900.0" y2="292.0" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(900.0,560.0) rotate(-90.0)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices shape how a person applies a skill with others, so the same skill lands differently depending on the practices behind it.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">People need practices like shared ownership and psychological safety to use their skills well on a team.</text></g><line x1="930.4" y1="836.9" x2="1163.8" y2="352.2" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1047.5,593.7) rotate(-64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices set the tone for how a team works together to deliver a project.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Projects are where a team's practices get tested under real pressure.</text></g><line x1="954.7" y1="856.4" x2="1375.4" y2="520.9" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1165.8,688.0) rotate(-38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices guide how a person carries out a duty alongside teammates.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A duty is carried out through practices that guide how a person works with others.</text></g><line x1="968.2" y1="884.4" x2="1492.8" y2="764.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1231.5,824.3) rotate(-12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices like humility and active listening shape how a team includes and serves its stakeholders.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Stakeholders are served better when a team practices humility, listening, and inclusion.</text></g><line x1="968.2" y1="915.6" x2="1492.8" y2="1035.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1231.5,975.7) rotate(12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices help a team stay aligned and adaptable as they work toward a milestone.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Reaching a milestone is smoother when the team leans on practices like adaptability and shared ownership.</text></g><line x1="954.7" y1="943.6" x2="1375.4" y2="1279.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1165.8,1112.0) rotate(38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices influence how openly and collaboratively a team uses its tools.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">How openly a team uses its tools reflects its practices.</text></g><line x1="930.4" y1="963.1" x2="1163.8" y2="1447.8" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(1047.5,1206.3) rotate(64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices shape how people show up for shared activities, like listening and making space for others.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Activities are where practices show up in how people work together.</text></g><line x1="900.0" y1="970.0" x2="900.0" y2="1508.0" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(900.0,1240.0) rotate(90.0)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices affect the quality of deliverables by shaping how the team collaborates to make them.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">The quality of a deliverable reflects how well the team practiced collaboration to make it.</text></g><line x1="869.6" y1="963.1" x2="636.2" y2="1447.8" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(752.5,1206.3) rotate(-64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices define the human, behavioral side of doing a job function well.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A job function is done well when a person brings strong team practices to it.</text></g><line x1="845.3" y1="943.6" x2="424.6" y2="1279.1" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(634.2,1112.0) rotate(-38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are the team habits a person brings no matter which specialization they pick.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Every specialization gets stronger when the person behind it works with healthy practices.</text></g><line x1="831.8" y1="915.6" x2="307.2" y2="1035.3" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(568.5,975.7) rotate(-12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices help a team stay healthy no matter which company type they work in.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Every company type benefits from healthy team practices, whatever its structure.</text></g><line x1="831.8" y1="884.4" x2="307.2" y2="764.7" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(568.5,824.3) rotate(12.9)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are the mindset that makes a methodology actually work, not just its steps.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">A methodology only works when the team lives out the practices behind it.</text></g><line x1="845.3" y1="856.4" x2="424.6" y2="520.9" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(634.2,688.0) rotate(38.6)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are taught and strengthened through team workshops.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">Workshops are where teams learn and rehearse healthy practices.</text></g><line x1="869.6" y1="836.9" x2="636.2" y2="352.2" stroke="#d1d5db" stroke-width="1.5" marker-start="url(#ah)" marker-end="url(#ah)"/><g transform="translate(752.5,593.7) rotate(64.3)"><text x="0" y="-5" text-anchor="middle" font-size="8" fill="#6b7280">Practices are transferable behaviors people can bring from any industry into tech work.</text><text x="0" y="9" text-anchor="middle" font-size="8" fill="#6b7280">People bring transferable practices, like collaboration, from any industry.</text></g><rect x="790" y="203" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="900" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Skills</text><text x="900" y="239" text-anchor="middle" font-size="9.5" fill="#374151">A competency in an area of</text><text x="900" y="251" text-anchor="middle" font-size="9.5" fill="#374151">expertise.</text><rect x="1076.3632678175886" y="268.36054718440346" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1186.3632678175886" y="288.36054718440346" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Project</text><text x="1186.3632678175886" y="304.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">A work outcome that meets</text><text x="1186.3632678175886" y="316.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">agreed to goals.</text><rect x="1306.0087784288996" y="451.4967307732359" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1416.0087784288996" y="471.4967307732359" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Duty</text><text x="1416.0087784288996" y="487.4967307732359" text-anchor="middle" font-size="9.5" fill="#374151">A set of expected duties.</text><rect x="1433.4524220400035" y="716.1361835888324" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1543.4524220400035" y="736.1361835888324" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Stakeholder</text><text x="1543.4524220400035" y="752.1361835888324" text-anchor="middle" font-size="9.5" fill="#374151">A person who drives the needs</text><text x="1543.4524220400035" y="764.1361835888324" text-anchor="middle" font-size="9.5" fill="#374151">of work.</text><rect x="1433.4524220400035" y="1009.8638164111676" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1543.4524220400035" y="1029.8638164111676" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Milestone</text><text x="1543.4524220400035" y="1045.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">A measured outcome of work</text><text x="1543.4524220400035" y="1057.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">progress.</text><rect x="1306.0087784288996" y="1274.5032692267641" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1416.0087784288996" y="1294.5032692267641" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Tool</text><text x="1416.0087784288996" y="1310.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">An object (physical or</text><text x="1416.0087784288996" y="1322.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">digital) that’s used to</text><text x="1416.0087784288996" y="1334.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">complete work.</text><rect x="1076.3632678175886" y="1457.6394528155965" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="1186.3632678175886" y="1477.6394528155965" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Activity</text><text x="1186.3632678175886" y="1493.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">A routine that people do</text><text x="1186.3632678175886" y="1505.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">together.</text><rect x="790" y="1523" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="900" y="1543" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Deliverable</text><text x="900" y="1559" text-anchor="middle" font-size="9.5" fill="#374151">Something provided as a result</text><text x="900" y="1571" text-anchor="middle" font-size="9.5" fill="#374151">of a process.</text><rect x="503.6367321824114" y="1457.6394528155965" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="613.6367321824114" y="1477.6394528155965" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Function</text><text x="613.6367321824114" y="1493.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">The label used to describe</text><text x="613.6367321824114" y="1505.6394528155965" text-anchor="middle" font-size="9.5" fill="#374151">responsibilities at a company.</text><rect x="273.99122157110037" y="1274.5032692267641" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="383.99122157110037" y="1294.5032692267641" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Specialization</text><text x="383.99122157110037" y="1310.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">An subject matter area of</text><text x="383.99122157110037" y="1322.5032692267641" text-anchor="middle" font-size="9.5" fill="#374151">expertise.</text><rect x="146.54757795999637" y="1009.8638164111676" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="256.5475779599964" y="1029.8638164111676" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Company Type</text><text x="256.5475779599964" y="1045.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">The formation type for a</text><text x="256.5475779599964" y="1057.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">company that dictates how work</text><text x="256.5475779599964" y="1069.8638164111676" text-anchor="middle" font-size="9.5" fill="#374151">gets delivered</text><rect x="146.5475779599966" y="716.136183588832" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="256.5475779599966" y="736.136183588832" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Methodology</text><text x="256.5475779599966" y="752.136183588832" text-anchor="middle" font-size="9.5" fill="#374151">A step-by-step process to</text><text x="256.5475779599966" y="764.136183588832" text-anchor="middle" font-size="9.5" fill="#374151">carry out work.</text><rect x="273.99122157110025" y="451.496730773236" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="383.99122157110025" y="471.496730773236" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Workshop</text><text x="383.99122157110025" y="487.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">A facilitated group activity</text><text x="383.99122157110025" y="499.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">that accomplishes a shared</text><text x="383.99122157110025" y="511.496730773236" text-anchor="middle" font-size="9.5" fill="#374151">goal.</text><rect x="503.6367321824116" y="268.36054718440346" width="220" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="613.6367321824116" y="288.36054718440346" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">Job Industry</text><text x="613.6367321824116" y="304.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">A category for companies that</text><text x="613.6367321824116" y="316.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">perform a certain type of</text><text x="613.6367321824116" y="328.36054718440346" text-anchor="middle" font-size="9.5" fill="#374151">work.</text><rect x="780" y="855" width="240" height="90" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="900" y="875" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">Practices</text><text x="900" y="891" text-anchor="middle" font-size="9.5" fill="#374151">A set of beliefs and behaviors</text><text x="900" y="903" text-anchor="middle" font-size="9.5" fill="#374151">that drive successful</text><text x="900" y="915" text-anchor="middle" font-size="9.5" fill="#374151">teamwork.</text></svg>