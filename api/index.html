<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skills &amp; Practices Framework — API</title>
    <meta
      name="description"
      content="Browse the open data of the Skills & Practices Framework: every dataset, its shape, and a live 'Try it' against the real files."
    />
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <!--
      Scalar renders this page from our OpenAPI spec. It is free and open source
      (MIT). The spec lives at ../openapi/openapi.json; every endpoint it lists is a
      real JSON file in this repository, served by GitHub Pages.

      The Scalar engine is SELF-HOSTED (vendored at ./scalar.js, pinned to
      @scalar/api-reference@1.64.1) rather than loaded from a third-party CDN, so there
      is no external script dependency and nothing that can be tampered with off-site.
      To update: download the same file at a new pinned version and replace ./scalar.js.
    -->
    <script
      id="api-reference"
      data-url="../openapi/openapi.json"
      data-configuration='{"theme":"default","layout":"modern","hideDownloadButton":false}'
    ></script>
    <script src="./scalar.js"></script>
  </body>
</html>
